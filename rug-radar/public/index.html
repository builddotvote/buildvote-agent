<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>rug radar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
      h1 { font-size: 1.4rem; }
      #feed { color: #666; }
      .launch { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
      .launch-header { display: flex; justify-content: space-between; align-items: baseline; }
      .mint { font-family: monospace; font-size: 0.85rem; color: #333; word-break: break-all; }
      .score { font-size: 1.3rem; font-weight: bold; }
      .score.low { color: #2a8; }
      .score.medium { color: #c80; }
      .score.high { color: #c33; }
      .signal { margin-top: 8px; font-size: 0.9rem; }
      .signal-name { font-weight: 600; }
      .signal ul { margin: 2px 0 0 0; padding-left: 20px; color: #555; }
    </style>
  </head>
  <body>
    <h1>rug radar</h1>
    <p>Live pump.fun launch risk scoring, from public on-chain data.</p>
    <div id="feed">Loading…</div>
    <script type="module">
      import { renderLaunch } from "/feed.js";

      async function refresh() {
        const feedEl = document.getElementById("feed");
        try {
          const res = await fetch("/api/feed");
          const data = await res.json();
          feedEl.innerHTML = data.launches.length
            ? data.launches.map(renderLaunch).join("")
            : "No launches scored yet.";
        } catch {
          feedEl.textContent = "Feed unavailable.";
        }
      }

      refresh();
      setInterval(refresh, 10000);
    </script>
  </body>
</html>
